[project]
name = "toyvla"
version = "0.1.0"
description = "Toy VLA on BabyAI: SmolVLM fine-tuned into a vision-language-action policy"
requires-python = ">=3.10"
# Tested with torch 2.14, transformers 5.19, peft 0.21, minigrid 3.1, gymnasium 1.4 (Python 3.13).
dependencies = [
    "torch>=2.4",
    "torchvision",
    "transformers>=4.56",
    "peft>=0.13",
    "minigrid>=3.0",
    "gymnasium>=1.0",
    "numpy",
    "pillow",
]

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["toyvla"]

# On Linux, torch and torchvision come from PyTorch's CUDA 12.6 index. Driver 535 (CUDA 12.2)
# runs CUDA 12.x wheels through minor-version compatibility, and 12.6 builds include Turing (sm_75).
# uv picks the newest torch that has a cu126 build. With driver >= 570 you can switch to cu128.
[tool.uv.sources]
torch = [{ index = "pytorch-cu126", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cu126", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
