[project]
name = "fpcoach"
version = "0.1.0"
description = "Football positioning coach: a VLA-style policy for build-up play, aligned with Google Research Football"
requires-python = ">=3.10"
# M1 (data and alignment) needs only these. Model training (M3+) will add torch; GRF (M2) is
# installed separately because it builds a C++ engine (see README).
dependencies = [
    "numpy",
    "pillow",
    "kloppy>=3.15",
]

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fpcoach"]
